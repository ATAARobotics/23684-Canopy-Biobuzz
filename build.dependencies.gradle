repositories {
    mavenCentral()
    google() // Needed for androidx
    // AaravLabs pub/sub (aaravlabs:pubsub) is published to GitHub Packages.
    // Auth is required even for public packages — provide credentials via
    // one of: ~/.gradle/gradle.properties (gpr.user + gpr.key),
    // environment variables GITHUB_USER + GITHUB_TOKEN, or Gradle's
    // ~/.gradle/init.gradle.
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/IamCoder18/ftcpubsub'
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_USER') ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty('gpr.key')   ?: System.getenv('GITHUB_TOKEN')
        }
    }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.1'
    implementation 'org.firstinspires.ftc:Blocks:11.2.1'
    implementation 'org.firstinspires.ftc:RobotCore:11.2.1'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.1'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.1'
    implementation 'org.firstinspires.ftc:Hardware:11.2.1'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.1'
    implementation 'org.firstinspires.ftc:Vision:11.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.pedropathing:ftc:2.1.2'
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation 'com.bylazar:fullpanels:1.0.12'
}

    implementation 'com.aaravlabs:pubsub:0.2.0'
}
