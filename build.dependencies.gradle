repositories {
    mavenCentral()
    google() // Needed for androidx
    // AaravLabs pub/sub (com.aaravlabs:pubsub) is published to GitHub Packages.
    // Auth is required even for public packages. Configure credentials via
    // gradle.properties with githubUser=... and githubToken=..., or via the
    // GITHUB_TOKEN environment variable.
    maven {
        url = uri("https://maven.pkg.github.com/IamCoder18/synapse")
        credentials {
            username = findProperty("githubUser") ?: System.getenv("GITHUB_USER") ?: System.getenv("GITHUB_ACTOR")
            password = findProperty("githubToken") ?: System.getenv("GITHUB_TOKEN")
        }
    }

    maven {
        url = uri("https://maven.pkg.github.com/IamCoder18/SafePedroPathing")
        credentials {
            username = findProperty("githubUser") ?: System.getenv("GITHUB_USER") ?: System.getenv("GITHUB_ACTOR")
            password = findProperty("githubToken") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.1'
    implementation 'org.firstinspires.ftc:Blocks:11.2.1'
    implementation 'org.firstinspires.ftc:RobotCore:11.2.1'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.1'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.1'
    implementation 'org.firstinspires.ftc:Hardware:11.2.1'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.1'
    implementation 'org.firstinspires.ftc:Vision:11.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.aaravlabs:synapse:0.3.1'
    implementation 'com.aaravlabs.safepedropathing:ftc:3.0.4'
}
